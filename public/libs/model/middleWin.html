    // 清空弹窗数据
    async function delPop(type) {
        if (oldDomId) {
            // 有oldDomId 则需要先移除echartsdom ,再清空弹窗dom
            let oldDom = document.getElementById(oldDomId);
            console.log(oldDomId)
            let customDom = document.getElementsByClassName('custom-max')
            customDom[0].style.display = 'none'
            if (oldDom) {
                oldDom.style.display = 'none'
                document.body.appendChild(oldDom)
            }
            if(!type) {
               oldDomId = null; 
            }
        }
        // 清空弹窗dom
        layer_div.removeAll()
        hotspots = []
        if (type) return

            target, //目标看向点
            time: 800, //飞行事件
            complete: function () {
                // Qmsg.success('飞行结束')
            }
        })
    }

        let tours;
        // 颜色，速度，开始半径，结束半径
        let toursSpeed = 2.2, toursStartRadius = 0.025, toursEndRadius = 0.1;

            endRadius: toursEndRadius,
            speed: toursSpeed,
        }
        tours = viewer.effectManager.addToursScanning(s);
        tours.position.set(
            point[0],
            point[1],
            point[2]
        );

        tours.scale.set(100, 100, 100)
        toursList.push(tours)
    }
