            let oldDom = document.getElementById(oldDomId);
            console.log(oldDomId)
            let customDom = document.getElementsByClassName('custom-max')
            customDom[0].style.display = 'none'

                // Qmsg.success('飞行结束')
            }
        })

    // 添加 扩散热点
    function addTours(point, color) {
        // 闪烁效果
        let tours;
        // 颜色，速度，开始半径，结束半径
        let toursSpeed = 2.2, toursStartRadius = 0.025, toursEndRadius = 0.1;
        let s = {
            startRadius: toursStartRadius,
            color: color,
            endRadius: toursEndRadius,
            speed: toursSpeed,
        }
        tours = viewer.effectManager.addToursScanning(s);
        tours.position.set(
            point[0],
            point[1],
            point[2]
        );

        tours.scale.set(100, 100, 100)
        toursList.push(tours)
    }

        // 闪烁效果
